<!doctype html>
<html lang="en">
  <head>
    <!-- @include head padanan="/portofolio/detail.html" judul="Project Details" deskripsi="Project details from PT. Asthana Cipta Mandiri." -->
  </head>
  <body>
    <!-- @include header-en padanan="/portofolio/detail.html" aktif="portofolio" -->

    <main id="konten">
      <section class="kepala-halaman">
        <div class="container">
          <ol class="remah" aria-label="Breadcrumb">
            <li><a href="/en/">Home</a></li>
            <li><a href="/en/portfolio/">Portfolio</a></li>
            <li aria-current="page">Details</li>
          </ol>
          <div id="kepalaMemuat">
            <div class="kerangka kerangka-terang mb-3" style="height: 44px; width: min(560px, 90%)"></div>
            <div class="kerangka kerangka-terang" style="height: 18px; width: 220px"></div>
          </div>
          <div id="kepalaIsi" hidden>
            <span class="lencana mb-3" style="background: #fff" id="lencanaKategori"></span>
            <h1 id="judulKarya"></h1>
            <p id="ringkasKarya"></p>
          </div>
        </div>
        <span class="lengkung" aria-hidden="true"></span>
      </section>

      <section class="bagian pt-5">
        <div class="container">
          <div id="isiKarya" hidden>
            <div class="row g-5">
              <div class="col-lg-8">
                <img id="sampulKarya" class="sampul-artikel" alt="" hidden />
                <div class="prosa" id="prosaKarya"></div>
                <div id="bagianGaleri" class="mt-5" hidden>
                  <h2 class="h4 mb-3">Gallery</h2>
                  <div class="galeri" id="galeriKarya"></div>
                </div>
              </div>
              <div class="col-lg-4">
                <aside class="kartu-lamar" style="position: sticky">
                  <h3>Project summary</h3>
                  <div class="ringkas-proyek mt-3" id="ringkasProyek"></div>
                  <div class="bagikan">
                    <span>Share</span>
                    <a class="wa" id="bagiWa" href="#" target="_blank" rel="noopener" aria-label="WhatsApp" title="WhatsApp"><i class="bi bi-whatsapp"></i></a>
                    <a class="li" id="bagiLi" href="#" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
                    <button type="button" class="salin" id="salinTautan" aria-label="Salin tautan" title="Salin tautan"><i class="bi bi-link-45deg"></i></button>
                  </div>
                  <a href="/en/contact/" class="btn btn-warna w-100 mt-4">Discuss a similar project</a>
                </aside>
              </div>
            </div>
          </div>

          <div id="galatKarya" class="keadaan-kosong" hidden>
            <span class="ikon-petak warna-jambu"><i class="bi bi-search"></i></span>
            <h3>Project not found</h3>
            <p>The link may have changed, or this project has not been published yet.</p>
            <a href="/en/portfolio/" class="btn btn-warna">View all projects</a>
          </div>
        </div>
      </section>

      <section class="bagian bagian-latar" id="bagianLainnya" hidden>
        <div class="container">
          <h2 class="judul-bagian mb-4">Other projects</h2>
          <div class="row g-4" id="daftarLainnya"></div>
        </div>
      </section>
    </main>

    <!-- @include footer-en -->
    <script type="module" src="/src/js/portofolio-detail.js"></script>
  </body>
</html>
