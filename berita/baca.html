<!doctype html>
<html lang="id">
  <head>
    <!-- @include head padanan="/en/news/read.html" judul="Berita" deskripsi="Kabar dari PT. Asthana Cipta Mandiri." -->
  </head>
  <body>
    <!-- @include header padanan="/en/news/read.html" aktif="berita" -->

    <main id="konten">
      <section class="kepala-halaman">
        <div class="container">
          <ol class="remah" aria-label="Remah roti">
            <li><a href="/">Beranda</a></li>
            <li><a href="/berita/">Berita</a></li>
            <li aria-current="page">Baca</li>
          </ol>
          <div id="kepalaMemuat">
            <div class="kerangka kerangka-terang mb-3" style="height: 44px; width: min(620px, 90%)"></div>
            <div class="kerangka kerangka-terang" style="height: 18px; width: 180px"></div>
          </div>
          <div id="kepalaIsi" hidden style="max-width: 820px">
            <span class="lencana mb-3" style="background: #fff" id="lencanaBerita" hidden></span>
            <h1 id="judulBerita"></h1>
            <p id="tanggalBerita"></p>
          </div>
        </div>
        <span class="lengkung" aria-hidden="true"></span>
      </section>

      <section class="bagian pt-5">
        <div class="container">
          <article id="isiBerita" class="mx-auto" style="max-width: 820px" hidden>
            <img id="sampulBerita" class="sampul-artikel" alt="" hidden />
            <div class="prosa" id="prosaBerita"></div>
            <div class="d-flex flex-wrap gap-2 align-items-center mt-5 pt-4 border-top">
              <strong class="me-2 text-dark">Bagikan:</strong>
              <a class="btn btn-garis btn-sm" id="bagiWa" target="_blank" rel="noopener"><i class="bi bi-whatsapp me-1"></i>WhatsApp</a>
              <a class="btn btn-garis btn-sm" id="bagiLi" target="_blank" rel="noopener"><i class="bi bi-linkedin me-1"></i>LinkedIn</a>
              <button class="btn btn-garis btn-sm" id="salinTautan" type="button"><i class="bi bi-link-45deg me-1"></i>Salin tautan</button>
            </div>
          </article>

          <div id="galatBerita" class="keadaan-kosong" hidden>
            <span class="ikon-petak warna-jambu"><i class="bi bi-search"></i></span>
            <h3>Berita tidak ditemukan</h3>
            <p>Mungkin tautannya sudah berubah atau berita ini belum diterbitkan.</p>
            <a href="/berita/" class="btn btn-warna">Lihat semua berita</a>
          </div>
        </div>
      </section>

      <section class="bagian bagian-latar" id="bagianLainnya" hidden>
        <div class="container">
          <h2 class="judul-bagian mb-4">Berita lainnya</h2>
          <div class="row g-4" id="daftarLainnya"></div>
        </div>
      </section>
    </main>

    <!-- @include footer -->
    <script type="module" src="/src/js/berita-baca.js"></script>
  </body>
</html>
